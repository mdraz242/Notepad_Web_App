<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${note.title} + ' - Notes App'">Note Detail - Notes App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-light.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 500;
            padding: 12px 20px;
            background-color: rgba(108, 92, 231, 0.1);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background-color: rgba(108, 92, 231, 0.2);
            transform: translateX(-5px);
        }

        .note-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .note-id {
            font-weight: 600;
            color: #6c5ce7;
            background-color: rgba(108, 92, 231, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .note-date {
            color: #636e72;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .note-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .action-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            border: none;
            font-family: 'Poppins', sans-serif;
        }

        .action-btn-edit {
            background: linear-gradient(to right, #6c5ce7, #a29bfe);
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
        }

        .action-btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(108, 92, 231, 0.35);
        }

        .action-btn-delete {
            background-color: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .action-btn-delete:hover {
            background-color: rgba(231, 76, 60, 0.2);
            transform: translateY(-2px);
        }

        .note-card {
            background-color: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            margin-bottom: 40px;
            border: 1px solid rgba(108, 92, 231, 0.05);
        }

        .note-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #6c5ce7, #a29bfe);
        }

        .note-header {
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 25px;
            border-bottom: 1px solid #f1f2f6;
        }

        .note-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
            line-height: 1.2;
            word-wrap: break-word;
        }

        .note-subtitle {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #636e72;
            font-size: 1.05rem;
        }

        .note-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7f8c8d;
            font-size: 0.95rem;
            background-color: #f8f9fa;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .note-content {
            font-size: 1.15rem;
            color: #333;
            line-height: 1.8;
        }

        /* Markdown/Text styling */
        .note-content h1, .note-content h2, .note-content h3 {
            font-family: 'Playfair Display', serif;
            color: #2c3e50;
            margin-top: 30px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .note-content h1 { font-size: 2.2rem; }
        .note-content h2 { font-size: 1.8rem; }
        .note-content h3 { font-size: 1.5rem; }

        .note-content p {
            margin-bottom: 20px;
        }

        .note-content strong, .note-content b {
            font-weight: 600;
            color: #2c3e50;
        }

        .note-content em, .note-content i {
            font-style: italic;
        }

        .note-content ul, .note-content ol {
            margin-left: 25px;
            margin-bottom: 20px;
        }

        .note-content li {
            margin-bottom: 8px;
        }

        .note-content blockquote {
            border-left: 4px solid #6c5ce7;
            padding-left: 20px;
            margin: 25px 0;
            color: #636e72;
            font-style: italic;
            background-color: rgba(108, 92, 231, 0.03);
            padding: 20px;
            border-radius: 0 8px 8px 0;
        }

        .note-content code {
            background-color: #f8f9fa;
            padding: 3px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #e74c3c;
        }

        .note-content pre {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 25px 0;
            border: 1px solid #eef2f7;
        }

        .note-content a {
            color: #6c5ce7;
            text-decoration: none;
            border-bottom: 1px solid rgba(108, 92, 231, 0.3);
            transition: all 0.2s ease;
        }

        .note-content a:hover {
            color: #4a3fcf;
            border-bottom-color: #4a3fcf;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid #f1f2f6;
        }

        .note-tags {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: rgba(108, 92, 231, 0.1);
            color: #6c5ce7;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .note-export {
            display: flex;
            gap: 12px;
        }

        .export-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            background-color: #f8f9fa;
            color: #636e72;
            border: 1px solid #eef2f7;
        }

        .export-btn:hover {
            background-color: #edf0f3;
            transform: translateY(-2px);
        }

        .empty-note {
            text-align: center;
            padding: 80px 20px;
            color: #7f8c8d;
        }

        .empty-note i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #dfe6e9;
        }

        .empty-note h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #636e72;
        }

        /* Print styles */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }

            .header, .note-actions, .note-footer {
                display: none !important;
            }

            .note-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }

            .note-card::before {
                display: none !important;
            }
        }

        /* Animation for note appearance */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .note-card {
            animation: fadeIn 0.6s ease-out;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .note-card {
                padding: 30px 25px;
            }

            .note-title {
                font-size: 2.2rem;
            }

            .note-content {
                font-size: 1.05rem;
            }

            .note-content h1 { font-size: 1.8rem; }
            .note-content h2 { font-size: 1.5rem; }
            .note-content h3 { font-size: 1.3rem; }

            .note-footer {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .note-export {
                align-self: stretch;
                justify-content: space-between;
            }

            .export-btn {
                flex: 1;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .note-card {
                padding: 25px 20px;
            }

            .note-title {
                font-size: 1.8rem;
            }

            .note-subtitle {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .note-actions {
                flex-direction: column;
            }

            .action-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="/" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Notes
        </a>

        <div class="note-meta">
            <div class="note-id">
                <i class="fas fa-hashtag"></i>
                <span th:text="${note.id}">ID</span>
            </div>
            <div class="note-date">
                <i class="far fa-clock"></i>
                <span id="currentDate"></span>
            </div>
        </div>
    </div>

    <div th:unless="${note}" class="empty-note">
        <i class="fas fa-search"></i>
        <h3>Note Not Found</h3>
        <p>The note you're looking for doesn't exist or has been deleted.</p>
        <a href="/" class="back-link" style="margin-top: 20px;">
            <i class="fas fa-arrow-left"></i> Return to Notes
        </a>
    </div>

    <div th:if="${note}" class="note-card">
        <div class="note-header">
            <h1 class="note-title" th:text="${note.title}">Note Title</h1>

            <div class="note-subtitle">
                <div class="stat-item">
                    <i class="fas fa-font"></i>
                    <span id="charCount">0</span> characters
                </div>
                <div class="stat-item">
                    <i class="fas fa-file-word"></i>
                    <span id="wordCount">0</span> words
                </div>
                <div class="stat-item">
                    <i class="far fa-clock"></i>
                    <span id="readTime">0</span> min read
                </div>
            </div>

            <div class="note-actions">
                <a th:href="@{/edit/{id}(id=${note.id})}" class="action-btn action-btn-edit">
                    <i class="fas fa-edit"></i> Edit Note
                </a>
                <a th:href="@{/delete/{id}(id=${note.id})}" class="action-btn action-btn-delete" onclick="return confirmDelete()">
                    <i class="fas fa-trash-alt"></i> Delete Note
                </a>
            </div>
        </div>

        <div class="note-content" id="noteContent" th:text="${note.content}">
            Note Content
        </div>

        <div class="note-footer">
            <div class="note-tags">
                <span class="tag">Personal</span>
                <span class="tag">Important</span>
                <span class="tag" th:if="${#strings.length(note.content) > 1000}">Long Read</span>
            </div>

            <div class="note-export">
                <a href="#" class="export-btn" onclick="printNote()">
                    <i class="fas fa-print"></i> Print
                </a>
                <a href="#" class="export-btn" onclick="copyNote()">
                    <i class="fas fa-copy"></i> Copy
                </a>
                <a href="#" class="export-btn" onclick="downloadNote()">
                    <i class="fas fa-download"></i> Download
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Set current date
        const now = new Date();
        const options = {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        };
        document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);

        // Calculate and display note statistics
        function calculateStats() {
            const noteContent = document.getElementById('noteContent').textContent;
            const charCount = noteContent.length;
            const wordCount = noteContent.trim().split(/\s+/).filter(word => word.length > 0).length;
            const readTime = Math.ceil(wordCount / 200); // Average reading speed: 200 words per minute

            document.getElementById('charCount').textContent = charCount.toLocaleString();
            document.getElementById('wordCount').textContent = wordCount.toLocaleString();
            document.getElementById('readTime').textContent = readTime;
        }

        // Process markdown if present in note content
        function processMarkdown() {
            const noteContentElement = document.getElementById('noteContent');
            let content = noteContentElement.textContent;

            // Simple markdown parsing (you can use a library like marked.js for full support)
            content = content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/^# (.*$)/gm, '<h1>$1</h1>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/^- (.*$)/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');

            // Wrap code blocks
            content = content.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

            // Apply syntax highlighting to code blocks
            noteContentElement.innerHTML = content;

            // Apply syntax highlighting
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            // Recalculate stats after processing
            setTimeout(calculateStats, 100);
        }

        calculateStats();
        processMarkdown();

        // Add animation to note card
        const noteCard = document.querySelector('.note-card');
        if (noteCard) {
            noteCard.style.opacity = '0';
            noteCard.style.transform = 'translateY(20px)';

            setTimeout(() => {
                noteCard.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                noteCard.style.opacity = '1';
                noteCard.style.transform = 'translateY(0)';
            }, 200);
        }
    });

    function confirmDelete() {
        return confirm('Are you sure you want to delete this note? This action cannot be undone.');
    }

    function printNote() {
        window.print();
        return false;
    }

    function copyNote() {
        const noteContent = document.getElementById('noteContent').textContent;
        const noteTitle = document.querySelector('.note-title').textContent;
        const textToCopy = `${noteTitle}\n\n${noteContent}`;

        navigator.clipboard.writeText(textToCopy).then(() => {
            // Show temporary success message
            const originalText = event.target.innerHTML;
            event.target.innerHTML = '<i class="fas fa-check"></i> Copied!';
            event.target.style.backgroundColor = 'rgba(46, 204, 113, 0.1)';
            event.target.style.color = '#27ae60';
            event.target.style.borderColor = 'rgba(46, 204, 113, 0.2)';

            setTimeout(() => {
                event.target.innerHTML = originalText;
                event.target.style.backgroundColor = '';
                event.target.style.color = '';
                event.target.style.borderColor = '';
            }, 2000);
        });

        return false;
    }

    function downloadNote() {
        const noteContent = document.getElementById('noteContent').textContent;
        const noteTitle = document.querySelector('.note-title').textContent;
        const fileName = `${noteTitle.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.txt`;
        const textToDownload = `${noteTitle}\n\n${noteContent}`;

        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(textToDownload));
        element.setAttribute('download', fileName);

        element.style.display = 'none';
        document.body.appendChild(element);

        element.click();

        document.body.removeChild(element);

        // Show temporary success message
        const originalText = event.target.innerHTML;
        event.target.innerHTML = '<i class="fas fa-check"></i> Downloaded!';
        event.target.style.backgroundColor = 'rgba(46, 204, 113, 0.1)';
        event.target.style.color = '#27ae60';
        event.target.style.borderColor = 'rgba(46, 204, 113, 0.2)';

        setTimeout(() => {
            event.target.innerHTML = originalText;
            event.target.style.backgroundColor = '';
            event.target.style.color = '';
            event.target.style.borderColor = '';
        }, 2000);

        return false;
    }

    // Handle keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        // Ctrl/Cmd + P for print
        if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
            e.preventDefault();
            printNote();
        }

        // Ctrl/Cmd + E for edit
        if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
            e.preventDefault();
            const editBtn = document.querySelector('.action-btn-edit');
            if (editBtn) editBtn.click();
        }

        // Escape key to go back
        if (e.key === 'Escape') {
            window.location.href = '/';
        }
    });
</script>
</body>
</html>
